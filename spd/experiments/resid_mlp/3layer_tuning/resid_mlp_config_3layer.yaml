########## 3 layers ##########
# --- WandB ---
wandb_project: nathu-spd-resid-mlp
wandb_run_name: null
wandb_run_name_prefix: ""

# --- General ---
unit_norm_matrices: false
seed: 0
m: 400
n_random_masks: 1
n_gate_hidden_neurons: 16
target_module_patterns:
  - "layers.*.mlp_in"
  - "layers.*.mlp_out"

# --- Loss Coefficients ---
param_match_coeff: 1.0
out_recon_coeff: 0.0
masked_recon_coeff: null
random_mask_recon_coeff: 1.0
layerwise_recon_coeff: null
layerwise_random_recon_coeff: 1.0
lp_sparsity_coeff: 5e-6
pnorm: 2
output_loss_type: mse

# --- Training ---
batch_size: 2048
steps: 120_000
lr: 1e-3
lr_schedule: constant
lr_warmup_pct: 0.00
n_eval_steps: 100

# --- Logging & Saving ---
image_freq: 5_000
image_on_first_step: true
print_freq: 500
save_freq: null

# --- Pretrained model info ---
pretrained_model_class: "spd.experiments.resid_mlp.models.ResidualMLP"
pretrained_model_path: "wandb:spd-train-resid-mlp/runs/4xdrdpkf" #wandb:nathu/spd-train-resid-mlp/runs/d5azngjz # 3 layers

# --- Task Specific ---
task_config:
  task_name: residual_mlp
  feature_probability: 0.01
  data_generation_type: "at_least_zero_active"