program: spd/experiments/resid_mlp/resid_mlp_decomposition.py
project: nathu-spd-resid-mlp
method: grid
metric:
  name: total_loss
  goal: minimize
parameters:
  seed:
    values: [0, 1, 2, 3]
  p_anneal_start_frac: 
    values: [0.25, 0.5]
  p_anneal_final_p:
    values: [0.5, 1]    
  
command:
- ${env}
- ${interpreter}
- ${program}
- spd/experiments/resid_mlp/3layer_tuning/resid_mlp_config_3layer.yaml