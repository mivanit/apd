program: spd/experiments/resid_mlp/resid_mlp_decomposition.py
project: nathu-spd-resid-mlp
method: grid
metric:
  name: total_loss
  goal: minimize
parameters:
  masked_recon_coeff:
    values: [0.1, 0.3, 1] 
  lp_sparsity_coeff:
    values: [1e-5, 2e-5]
  seed:
    values: [0, 1, 2, 3]
command:
- ${env}
- ${interpreter}
- ${program}
- spd/experiments/resid_mlp/3layer_tuning/resid_mlp_config_3layer.yaml