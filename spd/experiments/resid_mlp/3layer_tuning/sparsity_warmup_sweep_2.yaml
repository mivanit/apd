program: spd/experiments/resid_mlp/resid_mlp_decomposition.py
project: nathu-spd-resid-mlp
method: grid
metric:
  name: total_loss
  goal: minimize
parameters:
  seed:
    values: [0, 1, 2, 3]
  lp_sparsity_ramp_frac:
    values: [1.0]
  lp_sparsity_coeff:
    values: [1e-5, 3e-5, 1e-4, 3e-4, 1e-5]
  lp_sparsity_initial_coeff:
    values: [0.0, 5e-6]
  
command:
- ${env}
- ${interpreter}
- ${program}
- spd/experiments/resid_mlp/3layer_tuning/resid_mlp_config_3layer.yaml